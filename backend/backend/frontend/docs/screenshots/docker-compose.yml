services:
  database:
    image: postgres:16-alpine
    container_name: finsight-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: finsight-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: finsight-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  finsight_postgres_data:
